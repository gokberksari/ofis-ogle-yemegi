name: Ofis Yemek Menüsü Bot

on:
  # NOT: GitHub Actions'ın `schedule` cron'u "best-effort" olduğu için saatlerce
  # gecikebiliyordu (mesaj 05:00, 06:00, 12:30 gibi rastgele saatlerde düşüyordu).
  # Bu yüzden schedule kaldırıldı. Artık dış bir zamanlayıcı (cron-job.org) her gün
  # hafta içi TR 11:00'de aşağıdaki workflow_dispatch'i GitHub API üzerinden tetikliyor.
  # workflow_dispatch schedule'ın aksine anında (saniyeler içinde) çalışır.
  # Kurulum: docs/ZAMANLAMA.md
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Test için tarih (YYYY-MM-DD formatında, örn: 2025-08-01)'
        required: false
        default: ''

jobs:
  yemek-bildirimi:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout kod
      uses: actions/checkout@v4
    
    - name: Python kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Bağımlılıkları yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Yemek Menüsü Bot'u çalıştır
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: '#ogle-yemegi'
        TEST_DATE: ${{ github.event.inputs.test_date || '' }}
      run: python yemek_bot.py
